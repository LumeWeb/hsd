name: Docs
on:
  release:
    types: [published]
jobs:
  docs:
    name: Build docs
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
          node-version: 24.x
    - run: |
        npm install -g @hns-dev/bsdoc
        jsdoc -c jsdoc.json
    - name: Deploy
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./docs/reference
